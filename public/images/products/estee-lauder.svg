    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#f3e5ab"/>
      <stop offset="100%" stop-color="#aa8c2c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg6)" rx="30"/>
  <g transform="translate(145, 50)">
    <!-- Gold Cap -->
    <rect x="30" y="10" width="50" height="35" rx="3" fill="url(#goldCap)"/>
