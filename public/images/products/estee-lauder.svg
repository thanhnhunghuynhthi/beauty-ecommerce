      <stop offset="0%" stop-color="#fef8f0"/>
      <stop offset="100%" stop-color="#faebd7"/>
    </linearGradient>
    <linearGradient id="brown" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a2a18"/>
      <stop offset="50%" stop-color="#8b4513"/>
      <stop offset="100%" stop-color="#3d1c10"/>
