    <text x="55" y="90" font-size="7" font-family="Arial" font-weight="bold" fill="#3d1c10" text-anchor="middle">ESTĒE LAUDER</text>
    <text x="55" y="110" font-size="8" font-family="Arial" font-weight="bold" fill="#111" text-anchor="middle">ADVANCED</text>
    <text x="55" y="122" font-size="8" font-family="Arial" font-weight="bold" fill="#111" text-anchor="middle">NIGHT REPAIR</text>
    <text x="55" y="138" font-size="6" font-family="Arial" fill="#555" text-anchor="middle">Synchronized Multi-Recovery</text>
    <text x="55" y="175" font-size="8" font-family="Arial" font-weight="bold" fill="#3d1c10" text-anchor="middle">50 ml</text>
